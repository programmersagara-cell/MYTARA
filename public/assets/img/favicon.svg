<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2140"/><stop offset="1" stop-color="#081426"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/><stop offset="1" stop-color="#0B62E0"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA9F5"/><stop offset="1" stop-color="#1565D8"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC3F7"/><stop offset="0.6" stop-color="#1E88E5"/><stop offset="1" stop-color="#0B62E0"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="3" y="3" width="114" height="114" rx="24" fill="url(#bg)" stroke="url(#border)" stroke-width="3.5"/>

  <!-- Swoosh -->
  <path d="M8 72 C 18 96, 100 98, 112 60" fill="none" stroke="url(#swoosh)" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <!-- Gear -->
  <g fill="url(#gear)">
    <rect x="56.5" y="12" width="7" height="11" rx="2"/>
    <rect x="56.5" y="12" width="7" height="11" rx="2" transform="rotate(45 60 42)"/>
    <rect x="56.5" y="12" width="7" height="11" rx="2" transform="rotate(90 60 42)"/>
    <rect x="56.5" y="12" width="7" height="11" rx="2" transform="rotate(135 60 42)"/>
    <rect x="56.5" y="12" width="7" height="11" rx="2" transform="rotate(180 60 42)"/>
    <rect x="56.5" y="12" width="7" height="11" rx="2" transform="rotate(225 60 42)"/>
    <rect x="56.5" y="12" width="7" height="11" rx="2" transform="rotate(270 60 42)"/>
    <rect x="56.5" y="12" width="7" height="11" rx="2" transform="rotate(315 60 42)"/>
    <circle cx="60" cy="42" r="21"/>
  </g>
  <circle cx="60" cy="42" r="9" fill="#0B1B33"/>

  <!-- Server rack (left) -->
  <g>
    <rect x="26" y="52" width="18" height="8" rx="2" fill="#3E6EA8"/>
    <rect x="26" y="63" width="18" height="8" rx="2" fill="#4A7FBF"/>
    <rect x="26" y="74" width="18" height="8" rx="2" fill="#3E6EA8"/>
    <circle cx="31" cy="56" r="1.6" fill="#35E0F8"/><circle cx="36" cy="56" r="1.6" fill="#35C7F0"/>
    <circle cx="31" cy="67" r="1.6" fill="#35E0F8"/><circle cx="36" cy="67" r="1.6" fill="#35C7F0"/>
    <circle cx="31" cy="78" r="1.6" fill="#35E0F8"/><circle cx="36" cy="78" r="1.6" fill="#35C7F0"/>
    <rect x="40" y="55" width="3" height="2.5" rx="1" fill="#2C568C"/><rect x="40" y="66" width="3" height="2.5" rx="1" fill="#2C568C"/><rect x="40" y="77" width="3" height="2.5" rx="1" fill="#2C568C"/>
  </g>

  <!-- Monitor -->
  <g>
    <rect x="42" y="33" width="40" height="27" rx="3.5" fill="#8FD0F8"/>
    <rect x="45.5" y="36.5" width="33" height="20" rx="2" fill="#0F2C55"/>
    <rect x="48.5" y="40" width="8" height="7" rx="1.5" fill="#5FB8F2"/>
    <rect x="59.5" y="40.5" width="15" height="2.6" rx="1.3" fill="#6FC4F5"/>
    <rect x="59.5" y="45.5" width="15" height="2.6" rx="1.3" fill="#5FB8F2"/>
    <rect x="48.5" y="50" width="26" height="2.6" rx="1.3" fill="#4AA8E8"/>
    <rect x="57" y="60" width="10" height="4" fill="#7CC5F5"/>
    <rect x="52" y="64" width="20" height="3" rx="1.5" fill="#5FB8F2"/>
  </g>

  <!-- Package box (right) -->
  <g>
    <path d="M78 60 L84 53 L100 53 L94 60 Z" fill="#F4FAFF"/>
    <rect x="78" y="60" width="16" height="14" fill="#DDEBF9"/>
    <path d="M94 60 L100 53 L100 67 L94 74 Z" fill="#9FC3E8"/>
    <rect x="80.5" y="63.5" width="7" height="2.6" rx="1" fill="#7FA8D9"/>
  </g>

  <!-- Wrench (right) -->
  <g stroke="#E8EEF7" stroke-linecap="round" fill="none">
    <path d="M99 63 L109 77" stroke-width="5"/>
    <path d="M96.5 55.5 A 6.5 6.5 0 1 0 103.5 62.5" stroke-width="4"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="99" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="19" letter-spacing="0.5">
    <tspan fill="#FFFFFF">ITSa</tspan><tspan fill="#35A7F0">AMS</tspan>
  </text>
  <text x="60" y="107" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="4.6" letter-spacing="0.6" fill="#AEC2DE">IT SERVICES AND ASSET</text>
  <text x="60" y="112.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="4.6" letter-spacing="0.6" fill="#AEC2DE">MANAGEMENT SYSTEM</text>
</svg>
